<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب من التركستاني للبخاري</title>
<link rel="icon" href="logo.png">
<meta name="description" content="اطلب رز بخاري ودجاج شواية على الفحم ورز قابلي من التركستاني للبخاري في المجمعة">
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2118;--mut:#6f6254;--brand:#9c2f1a;--brand-ink:#fff;--line:#e6dccd;--ok:#1f7a3d}
@media (prefers-color-scheme:dark){:root{--bg:#1c1713;--card:#272019;--ink:#f3eadf;--mut:#b8a998;--brand:#d4553b;--brand-ink:#fff;--line:#3a3128;--ok:#4cc26f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:90px}
header{padding:16px;text-align:center}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--mut);font-size:14px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
#q{display:block;width:calc(100% - 32px);max-width:608px;margin:8px auto 0}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.hide,[hidden]{display:none!important}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#fff}
.item img.ph{object-fit:contain;padding:6px;opacity:.7}
#empty{text-align:center;color:var(--mut);padding:24px}
#dist{margin-top:8px;font-size:14px}
#dist.bad{color:#c0392b;font-weight:600}
nav a{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:20px;color:var(--ink);text-decoration:none;background:var(--card);font-size:15px}
main{max-width:640px;margin:0 auto;padding:0 16px}
section{scroll-margin-top:120px}
h2{font-size:18px;margin:22px 0 8px}
.note{color:var(--mut);font-size:13px;margin:-4px 0 8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .n{flex:1}
.item .p{color:var(--mut);font-size:14px}
.qty{display:flex;align-items:center;gap:6px}
button{font:inherit;cursor:pointer}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.qty button.add{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.qty span{min-width:20px;text-align:center;font-weight:600}
#bar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px;background:var(--card);border-top:1px solid var(--line);display:none}
#bar button{width:100%;max-width:640px;margin:0 auto;display:block;padding:14px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-size:17px;font-weight:600}
dialog{width:min(560px,94vw);max-height:92vh;border:0;border-radius:16px;padding:16px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;margin:12px 0 4px;font-weight:600}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;font-weight:400}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;padding:12px;text-align:center;border:1px solid var(--line);border-radius:10px}
.seg input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg input:focus-visible+span{outline:3px solid var(--ink)}
.line{display:flex;justify-content:space-between;padding:4px 0}
.total{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.err{color:#c0392b;font-size:14px;min-height:20px}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.row .go{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
.loc{margin-top:6px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--ink);width:100%}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px 16px}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="شعار التركستاني للبخاري" width="96" height="96" style="border-radius:16px;background:#fff">
  <h1>التركستاني للبخاري</h1>
  <p>المجمعة · طريق الملك فهد · الأسعار شاملة القيمة المضافة</p>
</header>
<div id="top">
  <input id="q" type="search" placeholder="ابحث عن صنف…" aria-label="ابحث عن صنف" autocomplete="off">
  <nav id="nav"></nav>
</div>
<main id="menu"></main>
<p id="empty" class="hide">ما لقينا صنف بهذا الاسم.</p>
<footer>الدفع كاش عند الاستلام · يتم تأكيد الطلب عبر واتساب</footer>
<div id="bar"><button id="open"></button></div>

<dialog id="dlg">
  <form method="dialog" id="form" novalidate>
    <h2 style="margin-top:0">مراجعة الطلب</h2>
    <div id="lines"></div>
    <div class="line"><span>مجموع الأصناف</span><span id="sub"></span></div>
    <div class="line" id="feeLine"><span id="feeLbl">رسوم التوصيل</span><span id="fee"></span></div>
    <div class="line total"><span>الإجمالي</span><span id="tot"></span></div>

    <label>طريقة الاستلام</label>
    <div class="seg">
      <label><input type="radio" name="kind" value="توصيل" checked><span>توصيل</span></label>
      <label><input type="radio" name="kind" value="استلام من المطعم"><span>استلام من المطعم</span></label>
    </div>

    <label for="nm">الاسم</label>
    <input id="nm" autocomplete="name">
    <label for="ph">رقم الجوال</label>
    <input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx">
    <div id="addrBox">
      <label for="ad">العنوان (الحي والشارع وأقرب معلم)</label>
      <textarea id="ad" rows="2"></textarea>
      <button type="button" class="loc" id="loc">📍 تحديد موقعي لحساب رسوم التوصيل (مطلوب)</button>
      <div id="dist" role="status"></div>
    </div>
    <label for="nt">ملاحظات (اختياري)</label>
    <input id="nt" placeholder="مثال: بدون ثوم">

    <div class="err" id="err" role="alert"></div>
    <div class="row">
      <button type="button" id="back">رجوع</button>
      <button type="button" class="go" id="send">إرسال الطلب عبر واتساب</button>
    </div>
  </form>
</dialog>

<script>
// ponytail: قائمة الطعام والرقم هنا فقط. عدّل الأسعار من هذا الملف مباشرة.
const WHATSAPP = "966539403811"; // رقم واتساب المندوب بصيغة دولية بدون + (تأكد منه)
// لإخفاء أصناف: اكتب أسماءها هنا كما هي في القائمة، مثال: const HIDE = ["شوربة", "خبز"];
// ولإرجاعها امسح اسمها من القائمة. القسم يختفي تلقائيًا لو أُخفيت كل أصنافه.
const HIDE = [];
const MENU = [
  ["الشواية", "مع الرز أو سادة", [
    ["حبة دجاج شواية مع الرز",42],["نص دجاج شواية مع الرز",21],["ربع دجاج شواية مع الرز",12],
    ["حبة دجاج شواية سادة",30],["نص دجاج شواية سادة",15],["ربع دجاج شواية سادة",8]]],
  ["الفحم", "", [
    ["حبة دجاج على الفحم مع الرز",44],["نص دجاج على الفحم مع الرز",22],["ربع دجاج على الفحم مع الرز",13],
    ["حبة دجاج على الفحم سادة",32],["نص دجاج على الفحم سادة",16],["ربع دجاج على الفحم سادة",9]]],
  ["المضغوط", "", [["حبة دجاج مضغوط",44],["نص دجاج مضغوط",22]]],
  ["المشاوي", "", [
    ["نفر كباب لحم (3 أسياخ)",23],["نفر كباب دجاج (3 أسياخ)",23],
    ["نفر شيش طاووق (3 أسياخ)",25],["نفر مشوي مشكل (3 أسياخ)",25]]],
  ["الرز", "", [["نفر رز بخاري",8],["نفر رز شعبي",8]]],
  ["اللحوم", "", [
    ["نفر مضغوط حاشي",60],["نفر كبسة حاشي",60],["نصف كبسة حاشي",30],
    ["نفر قابلي لحم",50],["نصف نفر قابلي لحم",25]]],
  ["المقبلات", "", [
    ["سلطة لبن خيار",6],["سلطة خضراء",6],["حمص",3],["متبل",3],["طحينة",3],
    ["تبولة",5],["سلطة ملفوف",5],["سلطة روسي",5],["مقبلات مشكل",10]]],
  ["الإيدامات", "صغير / كبير", [
    ["خضار مشكل (صغير)",5],["خضار مشكل (كبير)",7],["مصقعة (صغير)",5],["مصقعة (كبير)",7],
    ["ملوخية (صغير)",5],["ملوخية (كبير)",7],["بامية (صغير)",5],["بامية (كبير)",7],
    ["بطاطس دجاج (صغير)",6],["بطاطس دجاج (كبير)",8],
    ["شوربة",5],["مكرونة",5],["خبز",1.5]]],
  ["الصحون", "", [["صحن دائري صغير",4],["صحن دائري وسط",7],["صحن دائري كبير",13]]],
  ["الحلويات", "", [["كريم كراميل",4],["جيلي",4],["مهلبية",4]]],
  ["المشروبات", "", [
    ["مشروب غازي (علبة)",2.5],["مشروب غازي (لتر)",5],["مشروب غازي (عائلي)",9],
    ["لبن صغير",2],["لبن 360 مل",3],["لبن وسط",6],["لبن كبير",11],["زبادي",2],
    ["ماء صغير",0.5],["ماء كبير",1]]],
];

const IMG = {"حبة دجاج شواية مع الرز":"p49","نص دجاج شواية مع الرز":"p48","ربع دجاج شواية مع الرز":"p47","حبة دجاج شواية سادة":"p46","نص دجاج شواية سادة":"p45","ربع دجاج شواية سادة":"p44","حبة دجاج على الفحم مع الرز":"p55","نص دجاج على الفحم مع الرز":"p54","ربع دجاج على الفحم مع الرز":"p64","حبة دجاج على الفحم سادة":"p53","نص دجاج على الفحم سادة":"p52","ربع دجاج على الفحم سادة":"p94","حبة دجاج مضغوط":"p51","نص دجاج مضغوط":"p50","نفر كباب لحم (3 أسياخ)":"p43","نفر كباب دجاج (3 أسياخ)":"p42","نفر شيش طاووق (3 أسياخ)":"p41","نفر مشوي مشكل (3 أسياخ)":"p40","نفر رز بخاري":"p87","نفر رز شعبي":"p88","نفر مضغوط حاشي":"p89","نفر كبسة حاشي":"p91","نصف كبسة حاشي":"p90","نفر قابلي لحم":"p93","نصف نفر قابلي لحم":"p92","سلطة لبن خيار":"p69","سلطة خضراء":"p72","حمص":"p74","متبل":"p73","طحينة":"p75","تبولة":"p71","سلطة ملفوف":"p77","سلطة روسي":"p76","مقبلات مشكل":"p70","خضار مشكل (صغير)":"p36","خضار مشكل (كبير)":"p29","مصقعة (صغير)":"p35","مصقعة (كبير)":"p27","ملوخية (صغير)":"p25","ملوخية (كبير)":"p30","بامية (صغير)":"p34","بامية (كبير)":"p28","بطاطس دجاج (صغير)":"p33","بطاطس دجاج (كبير)":"p26","شوربة":"p31","مكرونة":"p32","مشروب غازي (علبة)":"p12","مشروب غازي (لتر)":"p17","مشروب غازي (عائلي)":"p13","لبن صغير":"p6","لبن 360 مل":"p19","لبن وسط":"p5","زبادي":"p3","ماء صغير":"p2","ماء كبير":"p1","كريم كراميل":"p78","جيلي":"p79","مهلبية":"p82"};

const $ = id => document.getElementById(id);
const cart = {}; // "قسم|اسم" -> {name, price, q}
const fmt = n => (Math.round(n * 100) / 100).toString().replace(/\.0+$/, "") + " ر.س";
const total = c => Object.values(c).reduce((s, i) => s + i.price * i.q, 0);

// ---- التوصيل: الرسوم حسب المسافة من المطعم ----
// ponytail: مسافة بخط مستقيم (المسافة على الطريق أطول قليلًا). عدّل الشرائح هنا، أو استخدم خدمة مسارات لاحقًا.
const REST = { lat: 25.9088261, lng: 45.3480399 };
const TIERS = [[3, 5], [10, 10], [13, 15]]; // [أقصى مسافة بالكم، الرسوم بالريال]
const MAX_KM = 13;
const toRad = d => d * Math.PI / 180;
function distKm(a, b) {
  const h = Math.sin(toRad(b.lat - a.lat) / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(toRad(b.lng - a.lng) / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}
const feeFor = km => { const t = TIERS.find(([max]) => km <= max); return t ? t[1] : null; };
const norm = s => s.replace(/[ً-ٰٟـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").toLowerCase();

function buildMessage(c, f) {
  const lines = Object.values(c).filter(i => i.q).map(i => `${i.q} × ${i.name} = ${fmt(i.price * i.q)}`);
  const del = f.kind === "توصيل", sub = total(c), fee = del ? f.fee : 0;
  return [
    `طلب جديد #${f.id}`,
    `النوع: ${f.kind}`,
    `الاسم: ${f.name}`,
    `الجوال: ${f.phone}`,
    del && f.addr ? `العنوان: ${f.addr}` : null,
    del ? `الموقع: https://maps.google.com/?q=${f.lat},${f.lng}` : null,
    "-----",
    ...lines,
    "-----",
    `مجموع الأصناف: ${fmt(sub)}`,
    del ? `رسوم التوصيل: ${fmt(fee)} (المسافة ${f.km} كم)` : null,
    `الإجمالي: ${fmt(sub + fee)} (شامل الضريبة)`,
    "الدفع: كاش عند الاستلام",
    f.note ? `ملاحظات: ${f.note}` : null,
  ].filter(Boolean).join("\n");
}

// ---- رسم القائمة ----
MENU.forEach(([title, hint, items], s) => {
  items = items.filter(([n]) => !HIDE.includes(n));
  if (!items.length) return;
  const a = document.createElement("a"); a.href = "#s" + s; a.textContent = title; $("nav").append(a);
  const sec = document.createElement("section"); sec.id = "s" + s; sec.dataset.s = norm(title);
  sec.innerHTML = `<h2></h2>${hint ? '<p class="note"></p>' : ""}`;
  sec.querySelector("h2").textContent = title;
  if (hint) sec.querySelector(".note").textContent = hint;
  items.forEach(([name, price]) => {
    const key = s + "|" + name;
    const row = document.createElement("div"); row.className = "item"; row.dataset.s = norm(name);
    row.innerHTML = `<div class="n"></div><div class="qty"><button type="button" aria-label="إزالة" hidden>−</button><span hidden>0</span><button type="button" class="add" aria-label="إضافة">+</button></div>`;
    row.querySelector(".n").innerHTML = `<div></div><div class="p">${fmt(price)}</div>`;
    row.querySelector(".n div").textContent = name;
    const img = document.createElement("img"); img.loading = "lazy"; img.width = img.height = 64;
    if (IMG[name]) { img.src = IMG[name] + ".jpg"; img.alt = name; } else { img.src = "logo.png"; img.alt = ""; img.className = "ph"; }
    row.prepend(img);
    const [minus, q, plus] = [row.querySelector("button"), row.querySelector("span"), row.querySelector(".add")];
    const set = n => {
      if (n > 0) cart[key] = { name, price, q: n }; else delete cart[key];
      q.textContent = n; minus.hidden = q.hidden = n === 0; minus.setAttribute("aria-label", "إزالة " + name); plus.setAttribute("aria-label", "إضافة " + name);
      refresh();
    };
    plus.onclick = () => set((cart[key]?.q || 0) + 1);
    minus.onclick = () => set((cart[key]?.q || 0) - 1);
    sec.append(row);
  });
  $("menu").append(sec);
});

// ---- البحث ----
$("q").oninput = () => {
  const t = norm($("q").value.trim()); let any = false;
  document.querySelectorAll("#menu section").forEach(sec => {
    let n = 0;
    sec.querySelectorAll(".item").forEach(r => { const show = !t || r.dataset.s.includes(t) || sec.dataset.s.includes(t); r.classList.toggle("hide", !show); n += show; });
    sec.classList.toggle("hide", !n); if (n) any = true;
  });
  $("empty").classList.toggle("hide", any);
};

function refresh() {
  const n = Object.values(cart).reduce((s, i) => s + i.q, 0);
  $("bar").style.display = n ? "block" : "none";
  $("open").textContent = `مراجعة الطلب (${n}) · ${fmt(total(cart))}`;
}

// ---- مراجعة وإرسال ----
let loc = null; // {lat, lng, km, fee}
const kind = () => document.querySelector('input[name=kind]:checked').value;
const setDist = (t, bad) => { $("dist").textContent = t; $("dist").classList.toggle("bad", !!bad); };
function renderTotals() {
  const del = kind() === "توصيل", fee = del && loc && loc.fee != null ? loc.fee : 0;
  $("sub").textContent = fmt(total(cart));
  $("feeLine").hidden = !del;
  $("fee").textContent = !del ? "" : !loc ? "حدد موقعك" : loc.fee == null ? "غير متاح" : fmt(loc.fee);
  $("tot").textContent = fmt(total(cart) + fee);
}
document.querySelectorAll('input[name=kind]').forEach(r => r.onchange = () => { $("addrBox").hidden = kind() !== "توصيل"; $("err").textContent = ""; renderTotals(); });
$("open").onclick = () => {
  $("lines").innerHTML = "";
  Object.values(cart).forEach(i => { const d = document.createElement("div"); d.className = "line"; d.innerHTML = "<span></span><span></span>"; d.children[0].textContent = `${i.q} × ${i.name}`; d.children[1].textContent = fmt(i.price * i.q); $("lines").append(d); });
  renderTotals(); $("err").textContent = ""; $("dlg").showModal();
};
$("back").onclick = () => $("dlg").close();
$("loc").onclick = () => {
  if (!navigator.geolocation) return setDist("متصفحك لا يدعم تحديد الموقع. اختر الاستلام من المطعم.", true);
  setDist("جاري تحديد موقعك…");
  navigator.geolocation.getCurrentPosition(p => {
    const lat = p.coords.latitude, lng = p.coords.longitude, km = distKm(REST, { lat, lng });
    loc = { lat, lng, km: Math.round(km * 10) / 10, fee: feeFor(km) };
    setDist(loc.fee == null
      ? `عذرًا، التوصيل غير متاح لأكثر من ${MAX_KM} كم (موقعك يبعد حوالي ${loc.km} كم). تقدر تختار الاستلام من المطعم.`
      : `المسافة التقريبية ${loc.km} كم · رسوم التوصيل ${fmt(loc.fee)}`, loc.fee == null);
    renderTotals();
  }, () => setDist("ما قدرنا نحدد موقعك. فعّل خدمة الموقع للمتصفح وحاول مرة ثانية، أو اختر الاستلام من المطعم.", true), { enableHighAccuracy: true, timeout: 15000 });
};
$("send").onclick = () => {
  const f = { kind: kind(), name: $("nm").value.trim(), phone: $("ph").value.trim().replace(/[\s-]/g, ""), addr: $("ad").value.trim(), note: $("nt").value.trim(), id: String(Date.now()).slice(-4) };
  if (!f.name) return $("err").textContent = "اكتب اسمك.";
  if (!/^(05\d{8}|9665\d{8})$/.test(f.phone)) return $("err").textContent = "رقم الجوال غير صحيح (مثال: 0501234567).";
  if (f.kind === "توصيل") {
    if (!loc) return $("err").textContent = "اضغط «تحديد موقعي» لحساب رسوم التوصيل.";
    if (loc.fee == null) return $("err").textContent = `التوصيل غير متاح لموقعك (أكثر من ${MAX_KM} كم). اختر الاستلام من المطعم.`;
    Object.assign(f, loc);
  }
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(buildMessage(cart, f))}`, "_blank");
};

// فحص ذاتي: افتح الصفحة بـ #test وانظر الكونسول
if (location.hash === "#test") {
  const c = { a: { name: "رز بخاري", price: 8, q: 2 }, b: { name: "ماء صغير", price: 0.5, q: 3 } };
  console.assert(total(c) === 17.5, "total");
  const m = buildMessage(c, { id: "1234", kind: "توصيل", name: "أحمد", phone: "0501234567", addr: "حي الفيصلية", lat: 25.9, lng: 45.3, km: 2.4, fee: 5, note: "" });
  console.assert(m.includes("رسوم التوصيل: 5 ر.س (المسافة 2.4 كم)") && m.includes("الإجمالي: 22.5 ر.س"), "msg");
  console.assert([2, 3].every(k => feeFor(k) === 5) && feeFor(4) === 10 && feeFor(10) === 10 && feeFor(11) === 15 && feeFor(13) === 15 && feeFor(13.1) === null, "tiers");
  console.assert(Math.abs(distKm(REST, { lat: REST.lat + 0.01, lng: REST.lng }) - 1.11) < 0.02, "haversine");
  console.assert(norm("طحينة") === norm("طحينه") && norm("أرز").includes("ارز"), "norm");
  console.log("self-check done");
}
