<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:90px}
header{padding:16px 16px 8px;text-align:center;position:relative}
#lang{position:absolute;inset-block-start:12px;inset-inline-end:12px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font-size:14px}
h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--mut);font-size:14px}
#info{margin:8px auto 0;max-width:640px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
#status{margin:8px auto 0;max-width:640px;padding:8px 12px;border-radius:10px;font-weight:600;font-size:14px}
#status.open{background:rgba(31,122,61,.15);color:var(--ok)}
#status.closed{background:rgba(192,57,43,.15);color:var(--bad)}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-top:8px}
#q{display:block;width:calc(100% - 32px);max-width:608px;margin:8px auto 0}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
nav a{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:20px;color:var(--ink);text-decoration:none;background:var(--card);font-size:15px}
main{max-width:640px;margin:0 auto;padding:0 16px}
section{scroll-margin-top:120px}
h2{font-size:18px;margin:22px 0 8px}
.note{color:var(--mut);font-size:13px;margin:-4px 0 8px}
.hide,[hidden]{display:none!important}
#booth{margin:8px auto 0;max-width:640px;padding:12px;border:2px solid var(--brand);border-radius:14px;background:var(--card)}
#boothTitle{font-size:24px;font-weight:700;text-align:center}
.bbtns{display:grid;gap:8px;margin-top:10px}
.bbtn{padding:16px;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:600}
.bbtn:disabled{opacity:.55;cursor:not-allowed}
#booth .note{margin:8px 0 0;font-size:14px;text-align:center}
#billDlg{width:min(92vw,420px);border:2px solid var(--brand);border-radius:16px;background:var(--card);color:var(--ink);padding:16px}

#billDlg h3{margin:0 0 8px;text-align:center}
#billDlg .bl>div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
#billDlg .bt{font-size:20px;color:var(--brand);border:0!important}
#billDlg .pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
#billDlg .pm label{padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:18px;font-weight:600}
#billDlg .pm label:has(input:checked){border-color:var(--brand);background:rgba(156,47,26,.12)}
#billDlg .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
#billDlg .chips button{padding:10px 14px;border:1px solid var(--brand);border-radius:10px;background:none;color:var(--ink);font-size:17px}
#billDlg input[type=number]{width:100%;padding:10px;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#billDlg .bact{display:grid;gap:8px;margin-top:10px}
#billDlg .bx{padding:12px;border:0;background:none;color:var(--mut);font-size:16px}
#billDlg .err{color:var(--bad);font-weight:600;min-height:1.2em}
#announce{margin:8px auto 0;max-width:640px;padding:8px 12px;border-radius:10px;background:rgba(156,47,26,.12);border:1px solid var(--brand);font-size:14px;font-weight:600}
#reorder{display:block;margin:8px auto 0;max-width:640px;width:100%;padding:10px 12px;border:1px solid var(--brand);border-radius:10px;background:none;color:var(--ink);font-size:15px}
.item .d{color:var(--mut);font-size:13px;margin-top:2px}
.item.sold{opacity:.55}
.item .soldtag{color:var(--bad);font-size:13px;font-weight:600}

#eta{font-weight:600}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#fff}
.item img.ph{object-fit:contain;padding:6px;opacity:.7}
.item .n{flex:1;min-width:0}
.item .p{color:var(--mut);font-size:14px}
.qty{display:flex;align-items:center;gap:6px}
button{font:inherit;cursor:pointer}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.qty button.add{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.qty span{min-width:20px;text-align:center;font-weight:600}
#empty{text-align:center;color:var(--mut);padding:24px}

label{display:block;margin:12px 0 4px;font-weight:600}

.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;font-weight:400}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;padding:12px;text-align:center;border:1px solid var(--line);border-radius:10px}
.seg input:checked+span{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg input:focus-visible+span{outline:3px solid var(--ink)}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.line .lq{display:flex;align-items:center;gap:6px}

.total{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

.err{color:var(--bad);font-size:14px;min-height:20px}
.row{display:flex;gap:8px;margin-top:12px}
.row button,.btnlink{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;text-align:center;text-decoration:none;display:block}
.row .go,.btnlink.go{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}

footer .contact{display:flex;justify-content:center;gap:12px;margin-bottom:12px}
footer .contact a{padding:10px 16px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);text-decoration:none;font-size:15px}

</head>

        <label><input type="radio" name="kind" value="استلام من المطعم"><span data-t="pickup"></span></label>

      <div class="row">
        <button type="button" id="back" data-t="back"></button>
        <button type="button" class="go" id="send" data-t="send"></button>

      <p data-t="doneP"></p>
      <p id="eta" hidden></p>

</dialog>

const kind = () => TABLE ? "جلسة" : document.querySelector('input[name=kind]:checked').value;
const setDist = (tx, bad, call) => {
  const d = $("dist"); d.textContent = tx; d.classList.toggle("bad", !!bad);
  if (call) { const a = document.createElement("a"); a.href = "tel:+966164313396"; a.textContent = " " + t("callFee"); d.append(a); }
};
function renderLines() {
  const L = $("lines"); L.innerHTML = "";
  Object.values(cart).forEach(i => {
    const d = document.createElement("div"); d.className = "line";
    d.innerHTML = `<span class="nn"></span><span class="lq"><button type="button" aria-label="-">−</button><b></b><button type="button" aria-label="+">+</button><span class="lp"></span></span>`;
    d.querySelector(".nn").textContent = nm(i.name);
    d.querySelector("b").textContent = i.q; d.querySelector(".lp").textContent = fmt(i.price * i.q);
    const [m, p] = d.querySelectorAll("button");
    m.onclick = () => { ITEM[i.name].set(i.q - 1); afterEdit(); };
    p.onclick = () => { ITEM[i.name].set(i.q + 1); afterEdit(); };
    L.append(d);
  });
  // اقتراحات
  const C = $("chips"); C.innerHTML = "";
  UPSELL.filter(n => ITEM[n] && !SOLDOUT.includes(n) && !Object.values(cart).some(i => i.name === n)).forEach(n => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = `+ ${nm(n)} (${fmt(ITEM[n].price)})`;
    b.onclick = () => { ITEM[n].set(1); afterEdit(); };
    C.append(b);
  });
  $("upBox").hidden = !C.children.length;
}
function afterEdit() { if (!Object.keys(cart).length) return $("dlg").close(); renderLines(); renderTotals(); }
const isFirst = () => !store.get("ord_last");
function renderTotals() {
  const del = kind() === "توصيل", fee = del && loc && loc.fee != null ? loc.fee : 0;
  const disc = TABLE ? 0 : discountFor(total(cart), isFirst());
  $("sub").textContent = fmt(total(cart));
  $("discLine").hidden = !disc; $("disc").textContent = disc ? "-" + fmt(disc) : "";
  $("feeLine").hidden = !del;
  $("fee").textContent = !del ? "" : !loc ? t("needLoc") : loc.fee == null ? t("na") : fmt(loc.fee);
  $("tot").textContent = fmt(total(cart) - disc + fee);
  const mn = $("minNote"); mn.hidden = !(del && MIN_ORDER); if (!mn.hidden) mn.textContent = t("minOrder")(fmt(MIN_ORDER));
}
document.querySelectorAll('input[name=kind]').forEach(r => r.onchange = () => { $("addrBox").hidden = kind() !== "توصيل"; $("err").textContent = ""; renderTotals(); });
$("open").onclick = () => {
  const c = TABLE ? null : store.get("ord_cust"); if (c) { $("nm").value = c.name || ""; $("ph").value = c.phone || ""; $("ad").value = c.addr || ""; }
  $("formBody").hidden = false; $("done").hidden = true;
  renderLines(); renderTotals(); renderTop(); $("err").textContent = ""; $("dlg").showModal(); track("open-review");
};
$("back").onclick = () => $("dlg").close();
$("again").onclick = () => { for (const k in cart) delete cart[k]; saveCart(); renderMenu(); refresh(); $("dlg").close(); window.scrollTo(0, 0); };

// المسافة على الطريق من خدمة OSRM العامة (مجانية بلا مفتاح). عند تعذرها نستخدم التقدير الاحتياطي.
// ponytail: خادم OSRM التجريبي بلا ضمان استمرارية؛ لو كثرت الطلبات استخدم خدمة مدفوعة أو خادمًا خاصًا.
async function roadKm(a, b) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 6000);
  try {
    const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`, { signal: ctl.signal });
    const j = await r.json();
    if (j.code === "Ok" && j.routes && j.routes[0]) return { km: j.routes[0].distance / 1000, road: true };
  } catch (e) { /* نستخدم التقدير */ } finally { clearTimeout(tm); }
  return { km: distKm(a, b) * FALLBACK, road: false };
}
$("loc").onclick = () => {
  if (!navigator.geolocation) return setDist(t("noGeo"), true, true);
  setDist(t("locBusy"));
  navigator.geolocation.getCurrentPosition(async p => {
    const lat = p.coords.latitude, lng = p.coords.longitude;
    setDist(t("locRoad"));
    const { km, road } = await roadKm(REST, { lat, lng });
    loc = { lat, lng, km: Math.round(km * 10) / 10, road, fee: feeFor(km) };
    const how = road ? t("onRoad") : t("estimated");
    setDist(loc.fee == null ? t("distFar")(MAX_KM, how, loc.km) : t("distOk")(how, loc.km, fmt(loc.fee)), loc.fee == null);
    renderTotals();
  }, () => setDist(t("geoFail"), true, true), { enableHighAccuracy: true, timeout: 15000 });
};
$("send").onclick = () => {
  const f = { kind: kind(), src: SRC, name: $("nm").value.trim(), phone: $("ph").value.trim().replace(/[\s-]/g, ""), addr: $("ad").value.trim(), id: String(Date.now()).slice(-4) };
  if (TABLE) { f.kind = "جلسة"; f.table = TABLE; f.disc = 0; }
  else {
    if (!openAt(HOURS, nowMin())) return $("err").textContent = t("eClosed");
    if (!f.name) return $("err").textContent = t("eName");
    if (!/^(05\d{8}|9665\d{8})$/.test(f.phone)) return $("err").textContent = t("ePhone");
    if (f.kind === "توصيل") {
      if (MIN_ORDER && total(cart) < MIN_ORDER) return $("err").textContent = t("eMin")(fmt(MIN_ORDER));
      if (!loc) return $("err").textContent = t("eLoc");
      if (loc.fee == null) return $("err").textContent = t("eFar")(MAX_KM);
      Object.assign(f, loc);
    }
    f.disc = discountFor(total(cart), isFirst());
    store.set("ord_cust", { name: f.name, phone: f.phone, addr: f.addr });
  }
  lastUrl = `https://wa.me/${TABLE ? BOOTH_WHATSAPP : WHATSAPP}?text=${encodeURIComponent(buildMessage(cart, f))}`;
  if (!TABLE) store.set("ord_last", { t: Date.now(), items: Object.values(cart).map(i => ({ name: i.name, q: i.q })) });
  $("wa").href = lastUrl; $("formBody").hidden = true; $("done").hidden = false;
  const eta = TABLE ? "" : (ETA[lang] || ETA.ar || "").trim(); $("eta").hidden = !eta; $("eta").textContent = eta ? t("etaLbl") + ": " + eta : "";
  $("rev").hidden = TABLE || !REVIEW_URL; if (REVIEW_URL) $("rev").href = REVIEW_URL;
  track("send-order");
  if (TABLE) { const r = boothRec(); Object.values(cart).filter(i => i.q).forEach(i => { const o = r.items[i.name] || (r.items[i.name] = { name: i.name, price: i.price, q: 0 }); o.q += i.q; }); r.t = Date.now(); store.set("ord_booth_" + TABLE, r); }
  sendReceipt(cart, f).then(ok => { if (!ok && TABLE) ntfy(`🍽️ طلب جلسة ${TABLE}`, buildMessage(cart, f)); }); // الإيصال صورة؛ إن فشل نص بسيط
  window.open(lastUrl, "_blank");
};

// ===== تشغيل =====
applyLang(); renderMenu();
(function restore() { const s = store.get(CK); if (s && s.cart && Date.now() - s.t < 6 * 3600 * 1000) applyCart(s.cart); else store.del(CK); })();
renderTop(); renderReorder(); refresh(); setInterval(renderTop, 60000);

// فحص ذاتي: افتح الصفحة بـ #test وانظر الكونسول
if (location.hash === "#test") {
  const c = { a: { name: "رز بخاري", price: 8, q: 2 }, b: { name: "ماء صغير", price: 0.5, q: 3 } };
  console.assert(total(c) === 17.5, "total");
  const m = buildMessage(c, { id: "1234", kind: "توصيل", name: "أحمد", phone: "0501234567", addr: "حي الفيصلية", lat: 25.9, lng: 45.3, km: 2.4, road: true, fee: 5 });
  console.assert(m.includes("رسوم التوصيل: 5 ر.س (المسافة 2.4 كم على الطريق)") && m.includes("الإجمالي: 22.5 ر.س"), "msg");
  console.assert([1, 3].every(k => feeFor(k) === 5) && feeFor(3.1) === 10 && feeFor(6) === 10 && feeFor(6.1) === 15 && feeFor(12) === 15 && feeFor(12.1) === null, "tiers");
  console.assert(Math.abs(distKm(REST, { lat: REST.lat + 0.01, lng: REST.lng }) - 1.11) < 0.02, "haversine");
  const H = { open: "11:00", close: "00:30" };
  console.assert(openAt(H, 720) && openAt(H, 10) && !openAt(H, 180) && !openAt(H, 659) && openAt(H, 660) && !openAt(H, 30) && openAt(null, 0), "hours");
  console.assert(norm("طحينة") === norm("طحينه"), "norm");
  console.assert(parseTable("?table=5", 8) === 5 && parseTable("?table=8", 8) === 8 && parseTable("?table=0", 8) === 0 && parseTable("?table=9", 8) === 0 && parseTable("?table=abc", 8) === 0 && parseTable("?table=3.5", 8) === 0 && parseTable("", 8) === 0, "table");
  const mb = buildMessage({ a: { name: "رز", price: 8, q: 1 } }, { id: "1", kind: "جلسة", table: 5 });
  console.assert(mb.includes("جلسة عائلية رقم 5") && !mb.includes("الجوال") && !mb.includes("رسوم التوصيل") && mb.includes("الدفع: عند الحساب"), "booth msg");
  console.assert(isRamadan(new Date("2026-03-01T12:00:00+03:00")) && !isRamadan(new Date("2026-11-26T12:00:00+03:00")) && isRamadan(new Date("2027-02-20T12:00:00+03:00")) && !isRamadan(new Date("2027-04-01T12:00:00+03:00")), "ramadan");
  console.assert(buildMessage({ a: { name: "رز", price: 8, q: 1 } }, { id: "1", kind: "استلام من المطعم", name: "س", phone: "0500000000", src: "google_profile" }).includes("المصدر: google_profile"), "src");
  console.assert(discountFor(100, true) === (FIRST_ORDER_PCT ? FIRST_ORDER_PCT : 0) && discountFor(100, false) === 0, "disc");
  const m2 = buildMessage({ a: { name: "رز بخاري", price: 10, q: 2 } }, { id: "1", kind: "استلام من المطعم", name: "س", phone: "0500000000", disc: 2 });
  console.assert(m2.includes("-2 ر.س") && m2.includes("الإجمالي: 18 ر.س"), "disc msg");
  const missing = MENU.flatMap(([, , it]) => it.map(([n]) => n)).filter(n => !EN[n]); console.assert(!missing.length, "EN missing: " + missing);
  console.log("self-check done");
}
